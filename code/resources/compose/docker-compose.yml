name: avh-evalscore

services:
  postgres:
    image: postgres:15
    container_name: avh-evalscore-db
    environment:
      POSTGRES_DB: evalscore
      POSTGRES_USER: postgresqldba
      POSTGRES_PASSWORD: admin
    ports:
      - "${POSTGRES_PORT:-55435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresqldba -d evalscore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
