[project]
name = "avh-evalscore"
version = "0.1.0"
description = "Contract-first service for authoring and running reproducible LLM evaluations with DeepEval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "avh-evalscore-server",
  "asyncpg>=0.30,<1.0",
  "deepeval>=4.0,<5.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.26,<5.0",
  "litellm>=1.63,<2.0",
  "opyoid>=4.0.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt[crypto]>=2.15.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mutmut>=3.3,<4.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "pytest-cov>=7.0,<8.0",
  "pytest-mock>=3.14,<4.0",
  "ruff>=0.9,<1.0",
  "openapi-contract-toolkit @ https://github.com/antoniovho/openapi-contract-toolkit/releases/download/v0.1.3/openapi_contract_toolkit-0.1.3-py3-none-any.whl",
]

[tool.openapi-contracts]
generator-command = "npx --yes @openapitools/openapi-generator-cli@2.41.0"
generator-version = "7.27.0"

[tool.openapi-contracts.contracts.avh-evalscore]
version = "0.1.2"
repository = "antoniovho/app-devtools"
tag = "avh-evalscore-api-v{version}"
artifact = "avh-evalscore-api-{version}.yml"
sha256 = "bd26056a0379a319347f66b72a289e24c611539caded2f003239ab0e814dab5c"
output = "contracts/open_api/avh-evalscore-api.yml"

[tool.openapi-contracts.generators.rest.server.avh-evalscore-server]
contract = "avh-evalscore"
generator = "python-fastapi"
template-profile = "python-fastapi-http"
output = "generated/avh_evalscore_server"
package-name = "avh_evalscore_server"
sourceFolder = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a dedicated PostgreSQL database configured through EVALSCORE_INTEGRATION_DATABASE_URL",
]

[tool.uv.sources]
avh-evalscore-server = { path = "generated/avh_evalscore_server", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["generated", "contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mutmut]
source_paths = ["evalscore/"]
on_dependency_change = "rerun"
pytest_add_cli_args_test_selection = ["tests/unit/"]

[tool.hatch.metadata]
allow-direct-references = true
