openapi: 3.0.3
info:
  contact:
    email: avelasco.horcajada@knowmadmood.com
    name: Antonio Velasco Horcajada
  description: API for authoring and executing reproducible LLM evaluations.
  title: AVH Evalscore
  version: 0.1.1
servers:
- description: Local development server
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- description: Evaluation suite and case authoring.
  name: Evaluations
- description: Asynchronous evaluation execution and immutable results.
  name: Evaluation Runs
paths:
  /v1/evaluations:
    get:
      description: Returns a paginated list of evaluation definitions available for
        execution.
      operationId: listEvaluations
      parameters:
      - description: Number of records to skip.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: Maximum records to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Direction applied to the selected sort field.
        explode: true
        in: query
        name: order
        required: false
        schema:
          $ref: "#/components/schemas/SortOrder"
        style: form
      - description: Field used to order evaluation suites.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/EvaluationSortBy"
        style: form
      - description: Case-insensitive partial match on the evaluation name.
        explode: true
        in: query
        name: name
        required: false
        schema:
          $ref: "#/components/schemas/EvaluationNameFilter"
        style: form
      - description: Return only evaluations with this target kind.
        explode: true
        in: query
        name: targetKind
        required: false
        schema:
          $ref: "#/components/schemas/TargetKind"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationListResponse"
          description: Evaluations
        "400":
          content:
            application/problem+json:
              example:
                type: /problems/bad-request
                status: 400
                title: Bad Request
                detail: The request is invalid.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The request is invalid.
        "401":
          content:
            application/problem+json:
              example:
                type: /problems/unauthorized
                status: 401
                title: Unauthorized
                detail: Authentication is required or the credentials are invalid.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: Authentication is required or failed.
        "422":
          content:
            application/problem+json:
              example:
                type: /problems/domain-validation
                status: 422
                title: Unprocessable Entity
                detail: The request violates a domain rule.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The request is syntactically valid but violates a domain rule.
        "500":
          content:
            application/problem+json:
              example:
                type: /problems/internal-server-error
                status: 500
                title: Internal Server Error
                detail: An unexpected server error occurred.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: An unexpected server error occurred.
      summary: List evaluations
      tags:
      - Evaluations
    post:
      description: Creates an evaluation definition with a configured target and evaluation
        engine.
      operationId: createEvaluation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
          description: Evaluation created
          headers:
            Location:
              explode: false
              required: true
              schema:
                format: uri-reference
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              example:
                type: /problems/bad-request
                status: 400
                title: Bad Request
                detail: The request is invalid.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The request is invalid.
        "401":
          content:
            application/problem+json:
              example:
                type: /problems/unauthorized
                status: 401
                title: Unauthorized
                detail: Authentication is required or the credentials are invalid.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: Authentication is required or failed.
        "422":
